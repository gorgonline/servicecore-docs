name: Doküman Kontrolü

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: İçerik ve derleme kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: İçerik kontrolü (frontmatter, MDX, görseller, bağlantılar)
        run: npm run check:mdx

      - name: Siteyi derle
        run: npm run build

      # types:check kendi başına `fumadocs-mdx` çalıştırır: tsc, .source/*.ts
      # üretilmiş olmadan "is not a module" hatası verir ve bu dosyaların
      # dolu olup olmaması build önbelleğine göre değişiyordu. Sıra artık
      # önemli değil, adım kendi girdisini garanti ediyor.

      - name: Tip kontrolü
        run: npm run types:check
